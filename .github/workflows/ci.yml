name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [protein_diffusion, protein_stability_uncertainty,
              protein_design_ops, active_learning_loop]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ${{ matrix.pkg }}
        working-directory: ${{ matrix.pkg }}
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
      - name: Test ${{ matrix.pkg }}
        working-directory: ${{ matrix.pkg }}
        run: PYTHONPATH=src python -m pytest tests/ -q

  vendored-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pytest tests/ -q

  snakemake-dryrun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: protein_diffusion
        run: |
          pip install -e .[test] snakemake
          snakemake -n
