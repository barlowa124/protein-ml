[project]
name = "protstab"
version = "0.1.0"
description = "Sequence -> protein thermal stability regression with calibrated uncertainty and homology-aware evaluation"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "pyyaml",
    "snakemake",
    "pulp<3",
]

[project.optional-dependencies]
esm = ["torch", "transformers"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
