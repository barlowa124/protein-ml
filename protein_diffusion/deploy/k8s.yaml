# Manifest for the DDPM sampling service. Provided, not deployed —
# no cluster was available at authoring time. Apply with:
#   kubectl apply -f deploy/k8s.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: protein-diffusion
spec:
  replicas: 2
  selector:
    matchLabels: {app: protein-diffusion}
  template:
    metadata:
      labels: {app: protein-diffusion}
    spec:
      containers:
        - name: serve
          image: protein-diffusion:latest  # build: docker build -f docker/Dockerfile .
          ports: [{containerPort: 8000}]
          resources:
            requests: {cpu: "1", memory: "1Gi"}
            limits: {cpu: "2", memory: "2Gi"}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: protein-diffusion
spec:
  selector: {app: protein-diffusion}
  ports: [{port: 80, targetPort: 8000}]
